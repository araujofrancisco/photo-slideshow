services:
  test:
    build:
      context: .
      target: test
    volumes:
      - jobs_data:/app/jobs
    environment:
      - JOB_DIR=/app/jobs
      - SLIDESHOW_MAX_WORKERS=1
      - PYTHONUNBUFFERED=1

  lint:
    build:
      context: .
      target: test
    command: >
      sh -c "python3 -m ruff check slideshow/ web/ &&
             python3 -m ruff format --check slideshow/ web/"
    environment:
      - PYTHONPATH=/app

volumes:
  jobs_data: